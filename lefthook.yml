# Pre-commit gates for the whole monorepo (lefthook runs from the git root).
# Bypassing with --no-verify / -n / SKIP is denied for agents (.claude/settings.json).
#
# Deliberately without the test suites (#288): they used to run here AND in
# Claude Code's Stop hook, both truncating the same local Postgres - the
# source of the OOM-killed commits and the phantom failures. Tests now run
# once, in the Stop hook (Claude Code) or by hand before the PR (any other
# agent, docs/workflow.md section Gate ladder), and always in CI.
pre-commit:
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,jsx,json}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm -r typecheck
    - name: kata-verify
      run: pnpm --filter @kumite/back exec kata verify --strict-coverage
